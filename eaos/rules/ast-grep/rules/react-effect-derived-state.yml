    - pattern: React.useEffect(() => { $SETTER($$$ARGS); }, [$$$DEPS])
    - pattern: React.useEffect(() => { $SETTER($$$ARGS) }, [$$$DEPS])
    - pattern: React.useEffect(() => $SETTER($$$ARGS), [$$$DEPS])
constraints:
  SETTER: {regex: '^set[A-Z]'}
