# A claim needs a number, a file or a fact id; these words stand in for one.
extends: existence
message: "'%s' is vague: state the measured fact, the file, or the evidence id instead."
level: error
ignorecase: false
# Go regular expressions give \b no meaning for Arabic letters: match the phrase itself.
nonword: true
tokens:
  - ربما
  - إلخ
  - وغيرها
  - بشكل عام
  - تحسين عام
  - تحسينات عامة
  - إلى حد ما
  - نوعًا ما
  - قد يكون
