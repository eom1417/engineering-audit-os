[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "engineering-audit-os"
version = "0.0.3"
description = "Architecture, structure and maintainability audit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["mcp>=2.2,<3", "pypdf>=5", "starlette>=1.7,<2", "sse-starlette>=3.4,<4", "uvicorn>=0.54,<1"]
[project.optional-dependencies]
facts = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
runtime = ["coverage>=7.0"]
live = ["pgserver>=0.1.4"]

[project.scripts]
eaos = "eaos.cli:main"
[tool.setuptools.packages.find]
include = ["eaos*"]
[tool.setuptools.package-data]
eaos = ["data/*.json", "data/*.md", "data/core/*.md", "data/modules/*.md", "data/schemas/*.json", "data/schemas/artifacts/*.json", "data/studio/*", "data/studio/**/*", "rules/*.json", "rules/**/*", "rules/.markdownlint-cli2.jsonc", "rules/vale/.vale.ini", "templates/**/*"]
