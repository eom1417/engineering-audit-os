[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "engineering-audit-os"
version = "0.0.71"
description = "Architecture, structure and maintainability audit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["mcp>=2.2,<3", "pypdf>=5", "starlette>=1.7,<2", "sse-starlette>=3.4,<4", "uvicorn>=0.54,<1"]
[project.optional-dependencies]
facts = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
runtime = ["coverage>=7.0"]
live = ["pgserver>=0.1.4"]
dev = ["pyflakes>=3,<5", "import-linter>=2.1,<3"]

[project.scripts]
eaos = "eaos.cli:main"
[tool.setuptools.packages.find]
include = ["eaos*"]
[tool.setuptools.package-data]
eaos = ["data/*.json", "data/schemas/*.json", "data/schemas/artifacts/*.json", "data/studio/*", "data/studio/**/*", "rules/*.json", "rules/**/*", "templates/**/*"]

# The layers as they stand (0.0.71), refused from going backwards (tools/quality.sh); M3.1 replaces them with the
# target layers of docs/ARCHITECTURE.md. Only direct imports are held: today everything reaches everything through
# the flat package root.
[tool.importlinter]
root_package = "eaos"

[[tool.importlinter.contracts]]
name = "Analyzers never import the pipeline, the reports or the interfaces"
type = "forbidden"
source_modules = ["eaos.assistants", "eaos.engines", "eaos.facts", "eaos.screens"]
forbidden_modules = ["eaos.api", "eaos.studio", "eaos.compose", "eaos.pipeline"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Facts never import the assistants or the screens"
type = "forbidden"
source_modules = ["eaos.facts"]
forbidden_modules = ["eaos.assistants", "eaos.screens"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Assistants never import the analyzers"
type = "forbidden"
source_modules = ["eaos.assistants"]
forbidden_modules = ["eaos.engines", "eaos.facts", "eaos.screens"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Reports never import the pipeline or the API"
type = "forbidden"
source_modules = ["eaos.compose"]
forbidden_modules = ["eaos.api", "eaos.pipeline"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Progress imports only the pipeline"
type = "forbidden"
source_modules = ["eaos.progress"]
forbidden_modules = ["eaos.api", "eaos.studio", "eaos.compose", "eaos.assistants", "eaos.engines", "eaos.facts", "eaos.screens"]
allow_indirect_imports = true

