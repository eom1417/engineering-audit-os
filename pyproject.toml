[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "engineering-audit-os"
version = "0.0.92"
description = "Architecture, structure and maintainability audit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["defusedxml>=0.7,<1", "mcp>=2.2,<3", "tomli>=2; python_version < '3.11'"]
[project.optional-dependencies]
facts = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
runtime = ["coverage>=7.0"]
live = ["pgserver>=0.1.4"]
dev = ["pyflakes>=3,<5", "import-linter>=2.1,<3"]

[project.scripts]
eaos = "eaos.doors.cli:main"
[tool.setuptools.packages.find]
include = ["eaos*"]
[tool.setuptools.package-data]
eaos = ["data/*.json", "data/schemas/*.json", "data/schemas/artifacts/*.json", "rules/*.json", "rules/**/*", "templates/**/*"]

# The architecture of docs/ARCHITECTURE.md: a kernel, features in tiers, and doors (tools/quality.sh).
[tool.importlinter]
root_package = "eaos"

[[tool.importlinter.contracts]]
name = "The kernel imports no feature and no door"
type = "forbidden"
source_modules = ["eaos.kernel"]
forbidden_modules = ["eaos.features", "eaos.doors"]
# Known and counted, only to fall: the facts runner still names every extractor (to invert into a registry).
ignore_imports = ["eaos.kernel.facts.run -> eaos.features.**"]

[[tool.importlinter.contracts]]
name = "Features import only the tiers under them, and no door"
type = "layers"
layers = [
  "eaos.doors",
  "(eaos.features.studio)",
  "(eaos.features.guided)",
  "(eaos.features.check)",
  "(eaos.features.report) | (eaos.features.tidy)",
  "(eaos.features.fix) | (eaos.features.plan)",
  "(eaos.features.ai_review)",
  "(eaos.features.claims)",
  "(eaos.features.layers) | (eaos.features.one_source) | (eaos.features.only_code) | (eaos.features.rules)",
  "(eaos.features.defects)",
  "(eaos.features.dead_code)",
  "(eaos.features.behaviour_lock)",
  "(eaos.features.app_run) | (eaos.features.assistant) | (eaos.features.code_reading) | (eaos.features.engines)",
  "eaos.kernel",
]
# Known and counted, only to fall: a batch's close still goes through the guided barrel (to untangle).
ignore_imports = [
  "eaos.kernel.facts.run -> eaos.features.**",
  "eaos.features.fix.journey.branch -> eaos.features.guided.journey",
  "eaos.features.fix.journey.finish -> eaos.features.guided.journey",
  "eaos.features.fix.journey.lanes -> eaos.features.guided.journey",
  "eaos.features.fix.journey.regenerate -> eaos.features.plan.analysis.project_guide",
]

[[tool.importlinter.contracts]]
name = "Inside a feature, each layer imports only the layers under it"
type = "layers"
containers = [
  "eaos.features.ai_review",
  "eaos.features.app_run",
  "eaos.features.assistant",
  "eaos.features.behaviour_lock",
  "eaos.features.check",
  "eaos.features.claims",
  "eaos.features.code_reading",
  "eaos.features.dead_code",
  "eaos.features.defects",
  "eaos.features.engines",
  "eaos.features.fix",
  "eaos.features.guided",
  "eaos.features.layers",
  "eaos.features.one_source",
  "eaos.features.only_code",
  "eaos.features.plan",
  "eaos.features.report",
  "eaos.features.rules",
  "eaos.features.studio",
  "eaos.features.tidy",
]
layers = ["(interface)", "(journey)", "(analysis)", "(facts)", "(adapters)"]
