[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "engineering-audit-os"
version = "0.0.86"
description = "Architecture, structure and maintainability audit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["defusedxml>=0.7,<1", "mcp>=2.2,<3", "pypdf>=5", "starlette>=1.7,<2", "sse-starlette>=3.4,<4", "uvicorn>=0.54,<1"]
[project.optional-dependencies]
facts = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
runtime = ["coverage>=7.0"]
live = ["pgserver>=0.1.4"]
dev = ["pyflakes>=3,<5", "import-linter>=2.1,<3"]

[project.scripts]
eaos = "eaos.interfaces.cli:main"
[tool.setuptools.packages.find]
include = ["eaos*"]
[tool.setuptools.package-data]
eaos = ["data/*.json", "data/schemas/*.json", "data/schemas/artifacts/*.json", "data/studio/*", "data/studio/**/*", "rules/*.json", "rules/**/*", "templates/**/*"]

# The layers of docs/ARCHITECTURE.md §2 (M3.1): each imports only the layers under it, directly or not (tools/quality.sh).
[tool.importlinter]
root_package = "eaos"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers under it"
type = "layers"
layers = ["eaos.interfaces", "eaos.journeys", "eaos.pipeline", "eaos.report", "eaos.ai", "eaos.analysis", "eaos.live",
          "eaos.facts", "eaos.engines", "eaos.core"]
