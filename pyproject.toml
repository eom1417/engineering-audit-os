[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "engineering-audit-os"
version = "1.0.0"
description = "Evidence-first engineering audit workspace and context CLI"
requires-python = ">=3.10"
readme = "README.md"
[project.scripts]
eaos = "eaos.cli:main"
[tool.setuptools.packages.find]
include = ["eaos*"]
[tool.setuptools.package-data]
eaos = ["data/*.json", "data/*.md", "data/core/*.md", "data/modules/*.md", "data/schemas/*.json"]
