<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>العيّنة</title>
<style>body{font:16px system-ui;margin:24px;color:#111;background:#fff}a{display:inline-block;padding:12px;min-width:44px;color:#0b5}</style></head>
<body>
<nav><a href="#/now">الآن</a> <a href="#/tasks">المهام</a> <a href="#/about">عن العيّنة</a></nav>
<main id="screen"></main>
<script>
const screens = { '#/now': 'ما يحدث الآن: ثلاث مهام مفتوحة ومهمتان منجزتان اليوم.', '#/tasks': 'قائمة المهام: كتابة التقرير، مراجعة الطلبات، الرد على العملاء.', '#/about': 'عيّنة صغيرة يفحصها EAOS في كل تحديث.' };
// The now screen shows the time, as HungerLab's does: two recordings of it differ unless the clock is held still.
const draw = () => { document.getElementById('screen').textContent = (screens[location.hash] || screens['#/now']) + ' ' + new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
addEventListener('hashchange', draw); draw(); setInterval(draw, 1000);
// The about screen shows a random tip, as many apps do: it can never be locked, and must not cost the other screens.
// Large random digits: always far over the 1% of pixels two recordings may differ by (a random colour was not).
const tip = document.createElement('p'); tip.style.cssText = 'font:900 96px monospace;word-break:break-all';
tip.textContent = Array.from({ length: 40 }, () => Math.floor(Math.random() * 10)).join(''); if (location.hash === '#/about') document.body.append(tip);
</script>
</body></html>
