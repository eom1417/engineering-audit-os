<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>العيّنة</title>
<style>body{font:16px system-ui;margin:24px;color:#111;background:#fff}button{padding:12px;min-width:44px}</style></head>
<body>
<!-- As a real SPA: drawn seconds after loading (a development server), sent to #/onboarding (a language, then start),
     then moving by a tab bar of buttons, with no link at all: the crawl must read the screens the code names. -->
<template id="app">
<section id="welcome"><p>أهلًا بك في العيّنة</p>
  <div id="language"><button onclick="chosen()">العربية</button> <button onclick="chosen()">English</button></div>
  <div id="start" hidden><button onclick="localStorage.started = 1; location.hash = '#/now'; show()">ابدأ</button></div></section>
<nav hidden><button onclick="location.hash = '#/now'">الآن</button> <button onclick="location.hash = '#/tasks'">المهام</button> <button onclick="location.hash = '#/about'">عن العيّنة</button></nav>
<main id="screen"></main>
</template>
<script>
const screens = { '#/onboarding': 'اختر لغتك ثم ابدأ.', '#/now': 'ما يحدث الآن: ثلاث مهام مفتوحة ومهمتان منجزتان اليوم.', '#/tasks': 'قائمة المهام: كتابة التقرير، مراجعة الطلبات، الرد على العملاء.', '#/about': 'عيّنة صغيرة يفحصها EAOS في كل تحديث.' };
if (!localStorage.started && !location.hash) location.hash = '#/onboarding';
// The now screen shows the time, as the SPA's does: two recordings of it differ unless the clock is held still.
const draw = () => { document.getElementById('screen').textContent = (screens[location.hash] || screens['#/now']) + ' ' + new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
const show = () => { const on = Boolean(localStorage.started); document.getElementById('welcome').hidden = on; document.querySelector('nav').hidden = !on; };
const chosen = () => { document.getElementById('language').hidden = true; document.getElementById('start').hidden = false; };
setTimeout(() => {
  document.body.append(document.getElementById('app').content.cloneNode(true));
  addEventListener('hashchange', draw); draw(); setInterval(draw, 1000); show();
  // The about screen shows a random tip, as many apps do: it can never be locked, and must not cost the other screens.
  // Large random digits: always far over the 1% of pixels two recordings may differ by (a random colour was not).
  const tip = document.createElement('p'); tip.style.cssText = 'font:900 96px monospace;word-break:break-all';
  tip.textContent = Array.from({ length: 40 }, () => Math.floor(Math.random() * 10)).join(''); if (location.hash === '#/about') document.body.append(tip);
}, 4000);
</script>
</body></html>
