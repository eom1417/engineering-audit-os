<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilingual</title>
  <script>
    // The language comes from localStorage (key "studio-lang"), the theme from the query (?theme=dark).
    const lang = localStorage.getItem('studio-lang') || 'en';
    const theme = new URLSearchParams(location.search).get('theme') || 'light';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.dataset.theme = theme;
  </script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
    [data-theme="dark"] body { color: #f5f5f5; background: #111111; }
    main { padding: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Bilingual / ثنائي اللغة</h1>
    <p>One page in two languages and two themes.</p>
  </main>
</body>
</html>
