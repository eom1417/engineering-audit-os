<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Clean page</title>
  <style>
    :root { color-scheme: light dark; --gap: 16px; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; color: #1a1a1a; background: #ffffff; }
    main { max-width: 960px; margin: 0 auto; padding: var(--gap); }
    h1 { font-size: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    button, .button { min-width: 44px; min-height: 44px; padding: 10px 18px; font-size: 16px;
      border: 2px solid #1d4ed8; background: #1d4ed8; color: #ffffff; border-radius: 8px; }
    .rail { display: flex; gap: 12px; overflow-x: auto; }
    .rail div { flex: 0 0 300px; height: 80px; background: #e5e7eb; }
    .cut { width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; }
    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f5; background: #111111; }
      .rail div { background: #333333; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Clean page</h1>
    <p>Every target is large enough, nothing leaves the viewport, and every control is named.</p>
    <div class="actions">
      <button type="button">Save</button>
      <a class="button" href="#details">Details</a>
    </div>
    <p class="cut" data-truncate title="A long finding title, cut on purpose and readable whole">A long finding title, cut on purpose and readable whole</p>
    <h2>Recent</h2>
    <div class="rail" data-scroll-x>
      <div></div><div></div><div></div><div></div>
    </div>
    <h2 id="details">Details</h2>
    <label><input type="checkbox" name="agree"> I agree</label>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="A placeholder" width="40" height="40">
  </main>
</body>
</html>
