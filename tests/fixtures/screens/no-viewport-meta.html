<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page without a viewport meta</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
    main { padding: 16px; max-width: 320px; }
  </style>
</head>
<body>
  <main>
    <h1>No viewport meta</h1>
    <p>Its content fits 390px, but without a viewport meta a phone lays the page out 980px wide and zooms it out.</p>
  </main>
</body>
</html>
