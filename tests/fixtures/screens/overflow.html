<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overflowing page</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
    main { padding: 16px; }
    .wide { width: 700px; height: 60px; background: #e5e7eb; }
  </style>
</head>
<body>
  <main>
    <h1>Overflowing page</h1>
    <div class="wide">A 700px-wide block in a 390px phone viewport.</div>
  </main>
</body>
</html>
